# The same config as the other darxnet libraries, except that err113, predeclared
# and gocritic builtinShadow stay on: gogram is a public API client whose errors
# users match with errors.Is, and it does not shadow builtins.
version: "2"

linters:
  default: all
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - whyNoLint
    govet:
      enable-all: true
      disable:
        - fieldalignment
    gosec:
      excludes:
        - G404
    revive:
      rules:
        - name: redefines-builtin-id
          disabled: true
  disable:
    - containedctx
    - cyclop
    - depguard
    - exhaustruct
    - exhaustruct_v5
    - forcetypeassert
    - funcorder
    - funlen
    - gochecknoglobals
    - goconst
    - godox
    - gomodguard
    - ireturn
    - mnd
    - nestif
    - nlreturn
    - noctx
    - noinlineerr
    - nonamedreturns
    - nolintlint
    - tagliatelle
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5

formatters:
  enable:
    - gofmt
